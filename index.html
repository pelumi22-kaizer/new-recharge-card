<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background: #00c853;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
    color: #1a1a1a;
}


body::before {
    content: "Airtime Recharge";
    display: block;
    width: 100%;
    text-align: center;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    padding: 24px 0;
    letter-spacing: 0.5px;
}


select, input[type="text"], button, h1 {
    width: 100%;
    max-width: 320px;
}

select, input[type="text"] {
    padding: 13px 14px;
    margin: 8px 0;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    font-size: 15px;
    background: #fff;
    outline: none;
    transition: border 0.2s;
}

select:focus, input[type="text"]:focus {
    border-color: #00c853;
    box-shadow: 0 0 0 3px rgba(0, 200, 83, 0.15);
}

button {
    padding: 14px;
    margin: 10px 0 24px;
    border: none;
    border-radius: 12px;
    background: #00c853;
    color: #fff;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}

button:hover {
    background: #00a844;
}

button:active {
    transform: scale(0.97);
}

h1 {
    background: #fff;
    font-size: 15px;
    margin: 0 0 4px;
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
}

#userDisplayPin {
    color: #00a844;
    font-weight: bold;
}

#balance {
    color: #00a844;
    font-weight: bold;
    font-size: 24px;
}

h2 {
    width: 100%;
    max-width: 320px;
    margin: 20px 0 10px;
    font-size: 15px;
    color: #fff;
}

table {
    border-collapse: collapse;
    width: 100%;
    max-width: 320px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
}

thead {
    background: #eafff0;
    color: #00a844;
}

th, td {
    padding: 10px 12px;
    text-align: center;
    font-size: 13px;
    border-bottom: 1px solid #f0f0f0;
}

tbody tr:hover {
    background: #f4fff8;
}

tbody tr:last-child td {
    border-bottom: none;
}
</style>
<body>
       <label class="d-block" for="">Select a Provider</label>
      <select id="userSim">
       <option value="">Select a Provider</option>
       <option value="MTN">MTN</option>
     <option value="Airtel">Airtel</option>
        <option value="Glo">Glo</option>
        <option value="9mobile">9mobile</option>
    </select>
    <br>
      <label class="d-block" for="">Select Price</label>
    <select id="userPrice">
         <option value="">Select a Price</option>
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
    </select>
    <h1>PIN: <span id="userDisplayPin"></span></h1>
    <button onclick="generatePin()">Generate Airtime</button>
    <h1>Load Airtime</h1>
    <div class="pin-input">
    <span>*311*</span>
    <input type="text" id="inputPin" placeholder="Enter PIN">
    <span>#</span>
</div>
    <button onclick="loadAirtime()">Load Airtime</button>
    <h1>Balance: <span id="balance">0</span></h1>
     <table>
        <thead>
            <tr>
                <th>S/N</th>
                <th>Pin</th>
                <th>Status</th>
                <th>Provider</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="pinTable">
        </tbody>
    </table>
  
</body>
</html>
<script>
let rechargePins= JSON.parse(localStorage.getItem("rechargePins")) ||[]
 let balance=Number(localStorage.getItem("balance")) ||0
function generatePin() {
  let userSim = document.getElementById("userSim").value;
    let userPrice = document.getElementById("userPrice").value;
    if (!userSim || !userPrice) {
        alert("All inputs are mandatory");
        return;
    }
    let rechargePin = Math.floor(
        100000000000 + Math.random() * 900000000000
    );
    console.log(rechargePin);
    let userInfo = {
        pin: rechargePin,
        status: "Unused",
        provider: userSim,
        amount: userPrice
    };
    rechargePins.push(userInfo);
    localStorage.setItem("rechargePins", JSON.stringify(rechargePins));
    document.getElementById("userDisplayPin").innerText = rechargePin;
    console.log(userInfo);
    displayPins();
}
function displayPins() {
    let display = "";
    for (let i = 0; i < rechargePins.length; i++) {
        display += `
            <tr>
                <td>${i + 1}</td>
                <td>${rechargePins[i].pin}</td>
                <td>${rechargePins[i].status}</td>
                <td>${rechargePins[i].provider}</td>
                <td>${rechargePins[i].amount}</td>
            </tr>
        `;
    }
    document.getElementById("pinTable").innerHTML = display;
}
 
function loadAirtime() {
    
    let loadCard= document.getElementById('inputPin').value

    let foundPin = rechargePins.filter(function(item) {
        return item.pin === Number(loadCard);
    });
    if (foundPin[0].status === "Used") {
    alert("This PIN has already been used");
    return;
}
    console.log(foundPin);
    balance += Number(foundPin[0].amount);
    localStorage.setItem("balance", balance);
    foundPin[0].status = "Used";
    localStorage.setItem("rechargePins", JSON.stringify(rechargePins));
    document.getElementById("balance").innerHTML = balance
    console.log(balance);
displayPins()
document.getElementById("inputPin").value = "";
}
displayPins()
document.getElementById("balance").innerHTML = balance;

</script>
