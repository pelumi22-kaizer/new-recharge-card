      <select id="userSim">
        <option value="Airtel">Airtel</option>

        <option value="Glo">Glo</option>

    <select id="userPrice">

            </tr>

        </tbody>

<script>
let rechargePins=[]
function generatePin() {
        let rechargePin = Math.floor(100000000000 + Math.random() * 900000000000);
    console.log(rechargePin);
  let userSim = document.getElementById("userSim").value;
let userPrice = document.getElementById("userPrice").value;
    let userInfo = {
        pin: rechargePin,
        status: "Unused",
        provider: userSim,
        amount: userPrice
    };
      rechargePins.push(userInfo);
    document.getElementById("userDisplayPin").innerText = rechargePin;
    console.log(userInfo);
    displayPins()
}
function displayPins() {
    let display = "";
    for (let i = 0; i < rechargePins.length; i++) {
        display += `
            <tr>
                <td>${i + 1}</td>
                <td>${rechargePins[i].pin}</td>
                <td>${rechargePins[i].status}</td>
                <td>${rechargePins[i].provider}</td>
                <td>${rechargePins[i].amount}</td>
            </tr>
        `;
    }
    document.getElementById("pinTable").innerHTML = display;
}
</script>
